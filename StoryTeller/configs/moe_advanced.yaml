# Advanced Mixture of Experts (MoE) Model Configuration
# ~800M total parameters, ~150M active per forward pass
#
# MODEL TYPE: Enhanced Sparse Mixture of Experts decoder-only transformer
# ARCHITECTURE: 24 layers × 1280 hidden × 20 heads
# MoE CONFIG: 16 experts per layer, Top-2 routing, every layer is MoE
# CONTEXT: 2048 tokens
#
# IMPROVEMENTS OVER BASE MoE:
# - Larger model capacity (800M vs 500M total params)
# - More experts (16 vs 8) for better specialization
# - All layers use MoE (not every other layer)
# - Larger hidden size (1280 vs 1024)
# - More layers (24 vs 16)
# - SwiGLU activation (better than GELU)
# - RMSNorm (faster than LayerNorm)
# - Optimized for multi-GPU training
#
# EXPECTED TRAINING TIME: 2-3 days on high-end GPU server (A100/H100)
# HARDWARE: 40GB+ VRAM per GPU, multi-GPU recommended
# OUTPUT QUALITY: State-of-the-art story generation with expert specialization

model:
  config_name: "moe_advanced"
  vocab_size: 50000  # Will be updated after tokenizer training
  max_seq_length: 2048
  hidden_size: 1280  # Increased from 1024
  num_layers: 24  # Increased from 16
  num_attention_heads: 20  # Increased from 16
  intermediate_size: 5120  # 4x hidden_size
  attention_dropout: 0.1
  hidden_dropout: 0.1
  positional_encoding: "rope"
  activation: "swiglu"  # Better than GELU
  norm_type: "rmsnorm"  # Faster than layernorm
  gradient_checkpointing: true
  use_flash_attention: true

  # Enhanced MoE configuration
  use_moe: true
  num_experts: 16  # Doubled from 8
  top_k_experts: 2  # Keep top-2 for efficiency
  moe_frequency: 1  # Apply MoE to EVERY layer (not every other)
  expert_capacity_factor: 1.25
  load_balancing_loss_weight: 0.01
  router_z_loss_weight: 0.001
  use_optimized_moe: true  # Use optimized MoE implementation to avoid tensor size bugs

training:
  # Data
  train_data_path: "data/processed/train.txt"
  val_data_path: "data/processed/val.txt"
  tokenizer_path: "data/tokenizers/storyteller-tokenizer/storyteller-tokenizer"
  use_cached_dataset: true
  cache_dir: "data/cache"

  # Optimization - Tuned for 3x V100 GPUs (32GB each)
  batch_size: 2  # Reduced for 3 GPUs
  gradient_accumulation_steps: 18  # Effective batch size: 36 (2*18=36)
  learning_rate: 1.5e-4  # Slightly lower for larger model
  weight_decay: 0.1
  max_grad_norm: 1.0

  # Schedule
  num_epochs: 10  # Fewer epochs due to larger model capacity
  warmup_steps: 5000  # Longer warmup for stability
  lr_scheduler: "cosine"

  # Mixed precision - Optimized for V100 (Volta architecture)
  use_amp: true
  amp_dtype: "float16"  # V100s don't have native BF16 support

  # Checkpointing
  save_dir: "checkpoints/moe_advanced"
  save_every_n_steps: 2500
  keep_last_n_checkpoints: 5

  # Logging
  log_every_n_steps: 50
  eval_every_n_steps: 500
  use_mlflow: true
  mlflow_experiment_name: "storyteller_advanced"
  mlflow_run_name: "moe_advanced_v1"
  mlflow_tracking_uri: "http://localhost:8080"
  mlflow_log_system_metrics: true
  log_expert_stats: true

  # Evaluation metrics
  evaluation:
    num_eval_samples: 100  # More samples for better quality assessment
    eval_max_length: 512
    eval_temperature: 1.0
    eval_top_k: 50
    eval_top_p: 0.95

  # Hardware - Multi-GPU configuration
  # For Jupyter notebook, we'll detect GPUs automatically
  # Options: "cuda:0", "cuda:1", "cuda", "smart"
  device: "cuda"  # Will use first available GPU
  num_workers: 8  # More workers for powerful server
  pin_memory: true

generation:
  max_new_tokens: 1024  # Allow longer stories
  temperature: 0.85  # Slightly lower for coherence
  top_p: 0.95
  top_k: 50
  repetition_penalty: 1.15
